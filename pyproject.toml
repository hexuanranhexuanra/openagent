[project]
name = "openagent"
version = "0.1.0"
description = "Self-evolving personal AI assistant"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "openai>=1.60.0",
    "anthropic>=0.43.0",
    "httpx>=0.28.0",
    "aiosqlite>=0.21.0",
    "typer>=0.15.0",
    "structlog>=24.0.0",
]

[project.optional-dependencies]
feishu = ["lark-oapi>=1.4.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
]

[project.scripts]
openagent = "src.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
